name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anixweb-server
    steps:
      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          path: anixweb-server

      - name: Checkout client repository
        uses: actions/checkout@v4
        with:
          repository: imnottimaq/anixweb
          path: anixweb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: anixweb-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: anixweb-server
