name: Checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  check:
    name: Run Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anixweb-server
    steps:
      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          path: anixweb-server

      - name: Checkout client repository
        uses: actions/checkout@v4
        with:
          repository: imnottimaq/anixweb
          path: anixweb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: anixweb-server/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
